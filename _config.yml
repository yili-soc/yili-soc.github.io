title: All About Security
author: Yi Li
description: Write-ups on detecting and responding to real-world attacks.
theme: minima
markdown: kramdown
timezone: America/Edmonton

plugins:
  - jekyll-feed
  - jekyll-seo-tag

github_username: yili-soc
linkedin_username: yilisoc
email: yilisecurity@gmail.com
show_excerpts: true

minima:
  date_format: "%b %-d, %Y"

header_pages:
  - index.md
  - about.md

exclude:
  - README.md

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/share-card.png
